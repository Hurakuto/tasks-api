name: Secret Demo

on:
  workflow_dispatch:

jobs:
  secret-demo:
    runs-on: ubuntu-latest
    steps:
      - name: Démonstration des secrets et variables
        env:
          DEMO_TOKEN: ${{ secrets.DEMO_TOKEN }}
          APP_ENV: ${{ vars.APP_ENV }}
        run: |
          if [ -z "$DEMO_TOKEN" ]; then
            echo "Erreur : le secret DEMO_TOKEN est vide ou non défini."
            exit 1
          fi

          echo "Longueur du secret : ${#DEMO_TOKEN}"
          echo "Valeur du secret : $DEMO_TOKEN"
          echo "Variable APP_ENV : ${{ vars.APP_ENV }}"
